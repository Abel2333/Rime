# luna_pinyin_simp.custom.yaml
#
# 朙月拼音·简化字 的方案补丁。
#   1. 词库换成个人主词表 lazyabel（见 lazyabel.dict.yaml）
#   2. 补上与 luna_pinyin.custom.yaml 一致的 emoji 开关
#
# 本方案只输出简体，故不设 simplification 开关。
# 于重新部署后生效。

patch:
  # 載入個人主詞表
  "translator/dictionary": lazyabel

  # 改寫拼寫運算，使含西文的詞彙（luna_pinyin.cn_en）不影響簡拼功能
  "speller/algebra/@before 0": xform/^([b-df-hj-np-tv-z])$/$1_/

  # 啓用 emoji
  switches/@next:
    name: show_es
    reset: 0
    states: [😔, 😀]

  'engine/filters/@before 0':
    simplifier@es_conversion

  es_conversion:
    opencc_config: emoji_symbols.json
    option_name: show_es
    tips: all
